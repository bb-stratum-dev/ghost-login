<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bb-stratum-dev | Ghost Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            padding: 16px;
            overflow: hidden;
        }

        /* Glassmorphic Container */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.125);
            border-radius: 20px;
            padding: 36px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
        }

        /* Badges & Typography */
        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            margin-bottom: 12px;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        /* Inputs & Controls */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.78rem;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* Action Button */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: transform 0.15s ease, opacity 0.15s ease;
            margin-top: 6px;
        }

        .btn-submit:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Dynamic Views */
        .hidden {
            display: none !important;
        }

        .hand-emoji {
            display: inline-block;
            font-size: 3rem;
            margin: 12px 0;
            animation: waveHand 0.8s infinite alternate ease-in-out;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 22px;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: #38bdf8;
            transition: width 3.2s linear;
        }

        .shake-effect {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Keyframes */
        @keyframes waveHand {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(28deg); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="glass-card" id="card">
        
        <!-- LOGIN VIEW -->
        <div id="loginView">
            <span class="badge">FastAPI Glass Auth</span>
            <h2>Sign In</h2>
            <p class="subtitle">Client-Side Authentication Sandbox</p>

            <form id="loginForm" onsubmit="executeLogin(event)">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="admin" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Authenticate</button>
            </form>
        </div>

        <!-- LOGOUT VIEW -->
        <div id="logoutView" class="hidden">
            <span class="badge" style="color:#4ade80; background:rgba(74,222,128,0.1); border-color:rgba(74,222,128,0.25);">
                ✓ 200 OK — Auth Success
            </span>
            <div class="hand-emoji">👋</div>
            <h2>Well Done!</h2>
            <p class="subtitle" id="statusMessage">Authentication successful.</p>
            <p style="font-size: 0.85rem; color: #cbd5e1; line-height: 1.45;">
                Storing session state is against our minimal policy. You are being logged out... gracefully! 🚀
            </p>

            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
        </div>

    </div>

    <script>
        function executeLogin(event) {
            event.preventDefault();
            
            const card = document.getElementById('card');
            const loginView = document.getElementById('loginView');
            const logoutView = document.getElementById('logoutView');
            const progress = document.getElementById('progress');

            // Switch to success view
            loginView.classList.add('hidden');
            logoutView.classList.remove('hidden');

            // Trigger countdown bar
            setTimeout(() => {
                progress.style.width = '0%';
            }, 50);

            // Auto Logout animation
            setTimeout(() => {
                card.classList.add('shake-effect');
                document.getElementById('statusMessage').innerText = "Logging out... Goodbye!";

                setTimeout(() => {
                    // Reset to initial state
                    card.classList.remove('shake-effect');
                    logoutView.classList.add('hidden');
                    loginView.classList.remove('hidden');
                    progress.style.width = '100%';
                    document.getElementById('loginForm').reset();
                    document.getElementById('statusMessage').innerText = "Authentication successful.";
                }, 500);

            }, 3200);
        }
    </script>
</body>
</html>
